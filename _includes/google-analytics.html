<!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // This config call sends the initial page_view
      gtag('config', '{{ site.google_analytics }}');
    </script>

    <!-- Enhanced Analytics Script V2 -->
    <script src="{{ '/assets/javascripts/ga-enhanced-ray-2.js' }}"
        data-ga-measurement-id="{{ site.google_analytics }}"
        data-enable-web-vitals="true"
        data-enable-auto-link-tracking="true"
        data-enable-scroll-tracking="true"
        data-enable-html-media-tracking="true"
        data-enable-youtube-tracking="true"   
        data-enable-spa-tracking="false"       
        data-enable-search-tracking="false"
        data-enable-pii-redaction="false"
        data-enable-adblock-detection="false" defer></script>
